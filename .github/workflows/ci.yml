name: CI
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check committed distributions match source
        run: npm run check:dist
      - name: Isolated Node Actions and installed npm package
        run: npm run smoke
      - name: Validate versioned tag (no publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run check:release
# Publishing is deferred. No npm token, publishing step, or mutable v1 release trigger.
